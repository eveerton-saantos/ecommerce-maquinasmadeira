<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h2>Área protegida</h2>
    <div id="welcomeMessage">Carregando...</div>

    <button onclick="mostrarSecao('meus-pedidos')">Meus Pedidos</button>
    <button onclick="mostrarSecao('perfil')">Informações Pessoais</button>
    <button onclick="mostrarSecao('lista-desejos')">Lista de Desejos</button>

    <button id="logoutBtn">Sair</button>

    <section id="meus-pedidos">
        <h2>Meus Pedidos</h2>
        <div id="lista-pedidos"></div>
    </section>

    <section id="lista-desejos" styles="display: none;">
        <h2>Minha lista de Desejos</h2>
        <div id="desejos-container"></div>
    </section>

    <section id="perfil" style="display: none;">
        <h2>Informações Pessoais</h2>
        <form id="form-perfil">
            <label>Nome:</label>
            <input type="text" id="nome" required />
            <label>Email:</label>
            <input type="email" id="email" required />
            <button type="submit">Salvar</button>
        </form>
    </section>

    <script src="../js/dashboard.js"></script>
</body>
</html>
